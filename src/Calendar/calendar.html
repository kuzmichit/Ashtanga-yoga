<!doctype html>
<html lang="en">

	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.gstatic.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&display=swap"
			rel="stylesheet" />

		<title>Ashtanga-yoga</title>
	</head>

	<body>
		<header id="header" class="container">
			<div class="header">
				<a class="header__logo" href="../../index.html"> SHALA EMPOLI
				</a>
				<nav class="header__nav">
					<!-- Navigazione desktop -->
					<ul class="header__menu">
						<li class="header__menu-item">
							<a class="header__menu-item-link"
								href="../../index.html">Torna alla home</a>
						</li>
					</ul>
				</nav>
		</header>
		<div class="calendar container" id="calendar">
			<div class="calendar__container">
				<div class="calendar__header">
					<div class="button__left button-array" data-direction="-1">
					</div>
					<h1 class="calendar-header__text">Gennaio</h1>
					<div class="button__right button-array" data-direction="1">
					</div>
				</div>
				<div class="month">
					<div class="list-dayname__container">
						<ul class="list-dayname">
							<li class="dayname">lu</li>
							<li class="dayname">ma</li>
							<li class="dayname">me</li>
							<li class="dayname">gi</li>
							<li class="dayname">ve</li>
							<li class="dayname">sa</li>
							<li class="dayname">do</li>
						</ul>
					</div>
					<div class="day__container">
						<ul class="list__days"></ul>
					</div>
				</div>
			</div>
		</div>
		<script type="module" src="./js/calendar.js" defer></script>
	</body>

</html>
