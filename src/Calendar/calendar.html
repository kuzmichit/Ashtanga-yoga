<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport"
			content="width=device-width, initial-scale=1.0">
		<title>Document</title>
	</head>

	<body>
		<header class="header container">
			<nav class="header__nav">
				<a class="header__logo" href="#">
					<img src=".assets/logo.png" width="144" height="19"
						alt="Логотип новостного сайта Performance" />
				</a>
				<ul class="header__menu">
					<li class="header__menu-item">
						<a class="header__menu-item-link" href="#">Sciala</a>
					</li>
					<li class="header__menu-item">
						<a class="header__menu-item-link" href="#">La nostra
							storia</a>
					</li>
					<li class="header__menu-item">
						<a class="header__menu-item-link" href="#">Notizie</a>
					</li>
					<li class="header__menu-item">
						<a class="header__menu-item-link" href="#">Contatti</a>
					</li>
					<li class="header__menu-item">
						<a class="header__menu-item-link active_link"
							href="#">Prenotazione</a>
					</li>
				</ul>
			</nav>
		</header>
		<div class="calendar container" id="calendar">
			<div class="calendar__container">
				<div class="calendar__header">
					<div class="button__left button-array" data-direction="-1">
					</div>
					<h1 class="calendar-header__text">Gennaio</h1>
					<div class="button__right button-array" data-direction="1">
					</div>
				</div>
				<div class="month">
					<div class="list-dayname__container">
						<ul class="list-dayname">
							<li class="dayname">lu</li>
							<li class="dayname">ma</li>
							<li class="dayname">me</li>
							<li class="dayname">gi</li>
							<li class="dayname">ve</li>
							<li class="dayname">sa</li>
							<li class="dayname">do</li>
						</ul>
					</div>
					<div class="day__container">
						<ul class="list__days"></ul>
					</div>
				</div>
			</div>
		</div>
		<script type="module" src="./js/calendar.js" defer></script>
	</body>

</html>
